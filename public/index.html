<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortofolioVerse — Jaringan Portofolio Sosial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#070914;--bg2:#0c1020;--panel:rgba(15,20,38,.72);
            --panel-strong:rgba(18,25,48,.92);--text:#f4f7ff;--muted:#8e9ab8;
            --line:rgba(148,163,184,.14);--cyan:#22d3ee;--blue:#6366f1;
            --violet:#a855f7;--pink:#ec4899;--green:#34d399;--red:#fb7185;
            --grad:linear-gradient(135deg,#22d3ee 0%,#6366f1 45%,#a855f7 100%);
            --glow:0 0 35px rgba(99,102,241,.22);
            --shadow:0 18px 55px rgba(0,0,0,.28);--r:22px;--r2:14px;
            --glass:rgba(255,255,255,.025);--text-dim:#cbd5e1;
            --font:'Inter',sans-serif;--sidebar:265px;--max:1320px
        }
        html{scroll-behavior:smooth}
        body{
            font-family:var(--font);color:var(--text);min-height:100vh;display:flex;
            padding:18px;gap:18px;overflow-x:hidden;
            background:
              radial-gradient(circle at 8% 10%,rgba(34,211,238,.10),transparent 28%),
              radial-gradient(circle at 88% 8%,rgba(168,85,247,.13),transparent 30%),
              radial-gradient(circle at 70% 90%,rgba(99,102,241,.08),transparent 28%),var(--bg);
        }
        body:before{
            content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
            background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent)
        }
        ::selection{background:rgba(34,211,238,.25)}
        ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:20px}
        .sidebar{
            width:var(--sidebar);min-height:calc(100vh - 36px);height:fit-content;position:sticky;top:18px;
            padding:20px 14px;background:rgba(10,14,29,.82);backdrop-filter:blur(22px);
            border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),var(--glow);
            display:flex;flex-direction:column;z-index:60
        }
        .sidebar-brand{display:flex;align-items:center;gap:12px;padding:5px 8px 20px;margin-bottom:16px;border-bottom:1px solid var(--line)}
        .logo-icon,.auth-logo .logo-icon{
            width:46px;height:46px;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:20px;box-shadow:0 8px 28px rgba(99,102,241,.35);position:relative;overflow:hidden
        }
        .logo-icon:after{content:"";position:absolute;inset:-40%;background:linear-gradient(45deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(25deg);animation:shine 4s infinite}
        @keyframes shine{0%,60%{transform:translateX(-80%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
        .sidebar-brand h1{font-size:19px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sidebar-brand span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
        .sidebar-nav{display:flex;flex-direction:column;gap:5px;flex:1}
        .sidebar-nav a{
            display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;color:var(--muted);
            text-decoration:none;font-weight:600;font-size:13px;transition:.25s;cursor:pointer;border:1px solid transparent
        }
        .sidebar-nav a i{width:20px;text-align:center;font-size:14px}
        .sidebar-nav a:hover{color:var(--text);background:rgba(99,102,241,.08);border-color:var(--line);transform:translateX(2px)}
        .sidebar-nav a.active{color:#fff;background:linear-gradient(90deg,rgba(99,102,241,.28),rgba(168,85,247,.12));border-color:rgba(99,102,241,.3);box-shadow:inset 3px 0 0 #6366f1}
        .sidebar-nav a[style*="ef4444"]{color:#fb7185!important;margin-top:auto}
        .sidebar-nav a[style*="ef4444"]:hover{background:rgba(251,113,133,.08)}
        .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:var(--max);margin:auto}
        .topbar{
            background:rgba(10,14,29,.78);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:var(--r);
            box-shadow:var(--shadow);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;
            position:sticky;top:18px;z-index:50
        }
        .topbar-left h2{font-size:19px;font-weight:750;display:flex;align-items:center;gap:9px;letter-spacing:-.3px}
        .topbar-left h2 i{color:var(--cyan)}
        .topbar-right{display:flex;align-items:center;gap:12px}
        .card,.feed-item{
            background:linear-gradient(145deg,rgba(18,25,48,.82),rgba(10,14,29,.72));backdrop-filter:blur(18px);
            border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:16px
        }
        .card:hover,.feed-item:hover{border-color:rgba(99,102,241,.25)}
        .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
        .card h3{font-size:16px}
        .btn{
            padding:10px 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;
            display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);transition:.25s
        }
        .btn:hover{transform:translateY(-2px)}
        .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 25px rgba(99,102,241,.25)}
        .btn-primary:hover{box-shadow:0 12px 30px rgba(99,102,241,.38)}
        .btn-outline{background:var(--glass);color:var(--text-dim);border-color:var(--line)}
        .btn-outline:hover{border-color:rgba(34,211,238,.4);color:var(--cyan);background:rgba(34,211,238,.05)}
        .btn-danger{background:#e11d48;color:#fff}.btn-sm{padding:7px 12px;font-size:12px}.btn-block{width:100%}
        .form-group{margin-bottom:17px}.form-group label{display:block;font-weight:650;font-size:12px;margin-bottom:7px;color:var(--text-dim)}
        .form-group input,.form-group textarea{
            width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:var(--font);
            font-size:13px;background:rgba(5,8,20,.55);color:var(--text);outline:none;transition:.2s
        }
        .form-group textarea{min-height:105px;resize:vertical}
        .form-group input:focus,.form-group textarea:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
        input::placeholder,textarea::placeholder{color:#64708c}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .auth-container{
            max-width:480px;margin:45px auto;padding:38px;background:rgba(12,17,34,.9);backdrop-filter:blur(22px);
            border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow),0 0 70px rgba(99,102,241,.10)
        }
        .auth-logo{text-align:center;margin-bottom:28px}.auth-logo .logo-icon{width:64px;height:64px;font-size:27px;margin:auto}
        .auth-logo h2{margin-top:16px;font-size:25px}.auth-logo p{color:var(--muted);font-size:12px;margin-top:5px}
        .feed-item{padding:20px}.feed-item strong{font-size:14px}.feed-item p{color:var(--text-dim);line-height:1.7;font-size:14px}
        .post-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
        .post-media img,.post-media video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
        .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
        .gallery-item{aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#090d1b;border:1px solid var(--line);position:relative}
        .gallery-item:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 55%,rgba(99,102,241,.15));pointer-events:none}
        .gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover}
        .user-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--glass);border-radius:14px;border:1px solid var(--line);margin-bottom:8px;transition:.2s}
        .user-item:hover{transform:translateX(3px);border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.04)}
        .toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:380px;width:calc(100% - 48px)}
        .toast{background:rgba(13,19,37,.95);backdrop-filter:blur(16px);padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:3px solid var(--cyan);font-size:13px;font-weight:550;display:flex;align-items:center;gap:10px}
        .modal-overlay{position:fixed;inset:0;background:rgba(2,4,12,.72);backdrop-filter:blur(12px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.open{display:flex}.modal{background:#0d1327;border:1px solid var(--line);border-radius:22px;max-width:600px;width:100%;padding:30px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
        #postMediaInput,#postLinkInput{background:rgba(5,8,20,.55)!important;color:var(--text)!important;border-color:var(--line)!important}
        #postContent{min-height:120px}

        .topbar-actions{display:flex;align-items:center;gap:8px}
        .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--text-dim);display:grid;place-items:center;cursor:pointer;transition:.2s}
        .icon-btn:hover{border-color:rgba(34,211,238,.4);color:var(--cyan);transform:translateY(-1px)}
        .theme-toggle{position:relative}
        .theme-toggle i{transition:.25s}
        .light-theme{
            --bg:#eef3ff;--bg2:#f7f9ff;--panel:rgba(255,255,255,.78);--panel-strong:rgba(255,255,255,.94);
            --text:#10172a;--muted:#64708c;--line:rgba(71,85,105,.15);
            --shadow:0 18px 55px rgba(31,41,55,.10);--glow:0 0 35px rgba(99,102,241,.08);
            --glass:rgba(15,23,42,.035);--text-dim:#475569
        }
        body.light-theme{
            background:radial-gradient(circle at 8% 10%,rgba(34,211,238,.13),transparent 28%),
                       radial-gradient(circle at 88% 8%,rgba(168,85,247,.11),transparent 30%),var(--bg);
            color:var(--text)
        }
        body.light-theme:before{opacity:.08}
        body.light-theme .sidebar,body.light-theme .topbar{
            background:rgba(255,255,255,.88);color:var(--text)
        }
        body.light-theme .card,body.light-theme .feed-item{background:rgba(255,255,255,.90);color:var(--text)}
        body.light-theme .form-group input,body.light-theme .form-group textarea,
        body.light-theme #postLinkInput,body.light-theme .search-wrap input,
        body.light-theme .skill-custom input,body.light-theme .comment-box input{
            background:#f8fafc!important;color:#10172a!important;border-color:rgba(71,85,105,.18)!important
        }
        body.light-theme .feed-item p,body.light-theme .user-item{color:#334155}
        body.light-theme .sidebar-nav a{color:#64748b}
        body.light-theme .sidebar-nav a:hover{color:#1e293b}
        body.light-theme .btn-outline{color:#334155;background:rgba(255,255,255,.65)}
        body.light-theme .skill-chip{color:#475569;background:#f8fafc}
        body.light-theme .comment-item{color:#334155;background:#f1f5f9}
        body.light-theme .modal{background:#fff;color:#10172a}
        body.light-theme .topbar-left h2{color:#10172a}
        body.light-theme .toast{background:rgba(255,255,255,.97);color:#10172a}
        body.light-theme .gallery-item{background:#e2e8f0}
        .post-actions{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
        .post-action{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 12px var(--font);cursor:pointer;transition:.2s}
        .post-action:hover{background:rgba(99,102,241,.08);color:var(--text)}
        .post-action.liked{color:#fb7185;background:rgba(251,113,133,.08)}
        .post-action i{font-size:14px}
        .comment-box{display:none;margin-top:10px}
        .comment-box.open{display:flex;gap:8px}
        .comment-box input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--text);outline:none}
        .comment-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
        .comment-item{font-size:12px;color:var(--text-dim);background:var(--glass);border-radius:9px;padding:8px 10px}
        .skill-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
        .skill-chip{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text-dim);font-size:12px;font-weight:650;cursor:pointer;transition:.2s}
        .skill-chip:hover,.skill-chip.selected{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08);color:var(--cyan)}
        .skill-custom{display:flex;gap:8px;margin-top:12px}
        .skill-custom input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--text);outline:none}
        .search-wrap{position:relative;margin-top:16px}
        .search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
        .search-wrap input{width:100%;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:13px;background:var(--glass);color:var(--text);outline:none}
        .search-wrap input:focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 3px rgba(34,211,238,.07)}
        .user-actions{margin-left:auto;display:flex;gap:7px}
        .follow-btn.following{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.25);color:#6ee7b7}
        .share-copy{font-size:11px;color:var(--muted);margin-left:4px}
        .skill-card{position:relative;overflow:hidden}
        .skill-card:before{content:"";position:absolute;right:-80px;top:-100px;width:220px;height:220px;border-radius:50%;background:rgba(34,211,238,.08);filter:blur(5px);pointer-events:none}
        .skill-search{position:relative;margin-top:18px}.skill-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
        .skill-search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:13px;background:var(--glass);color:var(--text);outline:none}
        .skill-category-tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 8px;scrollbar-width:thin}
        .skill-tab{white-space:nowrap;border:1px solid var(--line);background:var(--glass);color:var(--muted);padding:7px 11px;border-radius:999px;font:650 11px var(--font);cursor:pointer}
        .skill-tab:hover,.skill-tab.active{color:#fff;border-color:rgba(99,102,241,.38);background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(99,102,241,.16))}
        .skill-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px;max-height:280px;overflow:auto;padding:6px 2px 10px}
        .skill-chip{display:flex;align-items:center;justify-content:space-between;gap:7px;text-align:left;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:var(--text-dim);font-size:11px;font-weight:650;cursor:pointer;transition:.18s}
        .skill-chip:hover,.skill-chip.selected{border-color:rgba(34,211,238,.42);background:rgba(34,211,238,.075);color:var(--cyan);transform:translateY(-1px)}
        .skill-chip i{font-size:10px}.selected-skill-area{margin-top:12px;padding:13px;border-radius:13px;border:1px dashed rgba(34,211,238,.2);background:rgba(34,211,238,.025)}
        .selected-skill-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
        .selected-skill-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(99,102,241,.25);background:rgba(99,102,241,.09);color:#c4b5fd;padding:7px 9px;border-radius:999px;font:650 10px var(--font);cursor:pointer}
        .selected-skill-chip i{font-size:9px;color:var(--text-dim)}
        body.light-theme .skill-tab{color:#64748b;background:#f8fafc}
        body.light-theme .skill-tab.active{color:#3730a3}.skill-picker::-webkit-scrollbar{width:5px}

        .empty-state{text-align:center;padding:35px 10px;color:var(--muted)}
        @media(max-width:900px){
            body{padding:10px;display:block}.sidebar{position:fixed;left:10px;right:10px;bottom:10px;top:auto;width:auto;min-height:0;height:auto;padding:8px 10px;border-radius:18px}
            .sidebar-brand{display:none}.sidebar-nav{flex-direction:row;justify-content:space-around;gap:3px}.sidebar-nav a{flex:1;justify-content:center;padding:11px 5px;font-size:0}.sidebar-nav a i{font-size:16px;width:auto}.sidebar-nav a[style*="ef4444"]{margin-top:0}.main{padding-bottom:82px}.topbar{top:10px}
        }
        @media(max-width:600px){
            .topbar-left h2{font-size:16px}.topbar-left h2 i{display:none}#pageSub{display:none!important}
            .card,.feed-item{padding:17px;border-radius:18px}.form-row{grid-template-columns:1fr}.auth-container{margin:20px auto;padding:25px 20px}
            .gallery{grid-template-columns:repeat(2,1fr)}.post-media{grid-template-columns:repeat(2,1fr)}
        }
    
        .live-pill{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:1px;color:#86efac;padding:7px 9px;border:1px solid rgba(52,211,153,.18);background:rgba(52,211,153,.06);border-radius:999px}
        .live-pill span{width:6px;height:6px;background:#34d399;border-radius:50%;box-shadow:0 0 10px #34d399;animation:pulse 1.8s infinite}
        @keyframes pulse{50%{opacity:.35;transform:scale(.75)}} 
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo-icon"><i class="fas fa-people-arrows"></i></div>
            <div><h1>PortofolioVerse</h1><span>Jaringan Portofolio</span></div>
        </div>
        <nav class="sidebar-nav" id="mainNav"></nav>
    </aside>
    <main class="main">
        <header class="topbar">
            <div class="topbar-left"><h2 id="pageTitle"><i class="fas fa-home"></i> Beranda</h2><span id="pageSub" style="color:var(--muted);font-size:13px;margin-left:12px;">Feed global</span></div>
            <div class="topbar-actions"><span class="live-pill"><span></span> ONLINE</span><button class="icon-btn theme-toggle" id="themeToggle" title="Ganti tema"><i class="fas fa-moon"></i></button><div id="topbarRight"></div></div>
        </header>
        <div id="sectionContainer"></div>
    </main>
    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import * as api from './api.js';
        let currentUser = null;
        let usersCache = [];
        let feedCache = [];
        let messagesCache = [];

        function toast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
            container.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function normalizeUser(u) {
            if (!u) return u;
            const obj = { ...u };
            if (obj._id && !obj.id) obj.id = String(obj._id);
            ['organizations', 'projects', 'gallery', 'activities', 'following', 'followers', 'posts', 'notifications', 'skills']
                .forEach(k => { if (!Array.isArray(obj[k])) obj[k] = []; });
            return obj;
        }

        async function initApp() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const me = await api.getMe();
                    if (!me.error) {
                        currentUser = normalizeUser(me);
                        selectedSkills = (currentUser.skills && currentUser.skills.length) ? [...currentUser.skills] : selectedSkills;
                        localStorage.setItem('pv_selected_skills', JSON.stringify(selectedSkills));
                        const users = await api.getUsers();
                        if (Array.isArray(users)) usersCache = users.map(normalizeUser);
                    }
                } catch (e) { localStorage.removeItem('token'); }
            }
            renderApp();
        }

        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('open');
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        function getUnreadNotifCount() {
            if (!currentUser) return 0;
            return (currentUser.notifications || []).filter(n => !n.read).length;
        }
        function getUnreadThreadCount() {
            if (!currentUser) return 0;
            return messagesCache.filter(t => t.lastMessage && t.lastMessage.toUserId === currentUser.id && !t.lastMessage.read).length;
        }
        async function refreshMessagesCache() {
            const threads = await api.getThreads();
            if (Array.isArray(threads)) messagesCache = threads;
        }

        async function renderApp() {
            renderSidebar();
            renderTopbar();
            setTimeout(initTheme, 0);
            if (!currentUser) {
                renderAuthPage();
                return;
            }
            await refreshMessagesCache();
            renderSidebar();
            renderTopbar();
            renderSection('beranda');
        }

        function renderSidebar() {
            const nav = document.getElementById('mainNav');
            if (!currentUser) {
                nav.innerHTML = `
                    <a href="#" data-section="login" class="active"><i class="fas fa-sign-in-alt"></i> Login</a>

        function applyTheme(theme){
            const isLight = theme === 'light';
            document.body.classList.toggle('light-theme', isLight);
            document.body.dataset.theme = isLight ? 'light' : 'dark';
            localStorage.setItem('pv_theme', isLight ? 'light' : 'dark');
            const btn = document.getElementById('themeToggle');
            if(btn){
                btn.innerHTML = `<i class="fas ${isLight ? 'fa-sun' : 'fa-moon'}"></i>`;
                btn.title = isLight ? 'Aktif: Mode terang — klik untuk gelap' : 'Aktif: Mode gelap — klik untuk terang';
            }
        }

            const saved = localStorage.getItem('pv_theme') || 'dark';

        function isFollowing(id){ return (currentUser?.following || []).includes(String(id)); }

        function postKey(p){ return String(p.id || p._id || p.timestamp || p.content || Math.random()); }

            const res = await api.likePost(p.id);
            if (res && res.error) { toast(res.error, 'error'); return; }
            renderSection(document.querySelector('.sidebar-nav a.active')?.dataset.section || 'beranda');
        }
        function sharePost(p){
            const text = `${p.userName || 'Pengguna'}: ${p.content || ''}`;
            api.sharePost(p.id).catch(()=>{});
            if(navigator.share) navigator.share({title:'PortofolioVerse',text}).catch(()=>{});
            else if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('Postingan disalin untuk dibagikan.','success'));
            else toast('Bagikan postingan ini dari browser Anda.','info');
        }

                document.getElementById('pickMediaBtn').addEventListener('click', () => document.getElementById('postMediaInput').click());

                        const res = await api.uploadFile(f);

                                <button class="btn btn-primary btn-sm" id="openEditProfile"><i class="fas fa-pen"></i> Edit Profil</button>
                                <button class="btn btn-outline btn-sm" id="uploadAvatarBtn"><i class="fas fa-camera"></i> Ganti Avatar</button>
                            </div>
                        </div>
                        <p style="margin-top:16px;line-height:1.6;color:var(--text-dim);">${currentUser.bio || 'Belum ada bio singkat.'}</p>
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;">
                            <div style="padding:14px;border:1px solid var(--line);background:var(--glass);border-radius:14px;">
                                <div style="font-size:19px;font-weight:800;">${(currentUser.projects||[]).length}</div><div style="font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.7px;">Projects</div>
                            </div>
                            <div style="padding:14px;border:1px solid var(--line);background:var(--glass);border-radius:14px;">
                                <div style="font-size:19px;font-weight:800;">${(currentUser.skills||[]).length}</div><div style="font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.7px;">Skills</div>
                            </div>
                            <div style="padding:14px;border:1px solid var(--line);background:var(--glass);border-radius:14px;">
                                <div style="font-size:19px;font-weight:800;">${(currentUser.followers||[]).length}</div><div style="font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.7px;">Followers</div>
                            </div>
                        </div>
                    </div>
                    <div class="card skill-card">
                        <div class="card-header">
                            <div>
                                <div style="display:flex;align-items:center;gap:9px;"><span style="width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(34,211,238,.08);color:var(--cyan);"><i class="fas fa-sparkles"></i></span><h3>Skill Universe</h3></div>
                                <div style="font-size:11px;color:var(--muted);margin-top:6px;">Pilih kemampuan dari berbagai bidang profesional.</div>
                            </div>
                            <span id="skillCountBadge" style="font-size:10px;color:var(--cyan);font-weight:800;letter-spacing:1px;">${selectedSkills.length} SELECTED</span>
                        </div>
                        <div class="skill-search">
                            <i class="fas fa-search"></i>
                            <input id="skillSearchInput" placeholder="Cari skill apa saja..." autocomplete="off" />
                        </div>
                        <div class="skill-category-tabs" id="skillCategoryTabs">
                            <button class="skill-tab active" data-cat="ALL">Semua</button>
                            ${Object.keys(SKILL_CATEGORIES).map(cat=>`<button class="skill-tab" data-cat="${cat}">${cat}</button>`).join('')}
                        </div>
                        <div id="skillPicker" class="skill-picker"></div>
                        <div class="selected-skill-area">
                            <div style="font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Skill pilihan Anda</div>
                            <div id="selectedSkillChips" class="selected-skill-chips"></div>
                        </div>
                        <div class="skill-custom">
                            <input id="customSkillInput" placeholder="Skill yang belum ada? Tambahkan sendiri..." />
                            <button class="btn btn-primary btn-sm" id="addSkillBtn"><i class="fas fa-plus"></i> Tambah</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3>Galeri Karya & Foto</h3>
                            <button class="btn btn-primary btn-sm" id="uploadGalleryBtn"><i class="fas fa-upload"></i> Unggah ke Galeri</button>
                        </div>
                        <div class="gallery" id="galleryContainer">
                            ${(currentUser.gallery || []).length === 0 ? '<p style="color:var(--muted);">Belum ada media galeri.</p>' : currentUser.gallery.map(g => `<div class="gallery-item"><img src="${g.dataUrl}" /></div>`).join('')}
                        </div>
                    </div>
                `;

                document.getElementById('openEditProfile').addEventListener('click', () => {
                    const modal = document.getElementById('modalOverlay');
                    const content = document.getElementById('modalContent');
                    content.innerHTML = `
                        <h3>Edit Profil</h3>
                        <div class="form-group" style="margin-top:16px;"><label>Nama Lengkap</label><input id="editName" value="${currentUser.name}" /></div>
                        <div class="form-group"><label>Judul Profesional</label><input id="editTitle" value="${currentUser.title || ''}" /></div>
                        <div class="form-group"><label>Lokasi</label><input id="editLocation" value="${currentUser.location || ''}" /></div>
                        <div class="form-group"><label>Bio</label><textarea id="editBio">${currentUser.bio || ''}</textarea></div>
                        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
                            <button class="btn btn-outline btn-sm" id="closeModal">Batal</button>
                            <button class="btn btn-primary btn-sm" id="saveProfileBtn">Simpan</button>
                        </div>
                    `;
                    modal.classList.add('open');
                    document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('open'));
                    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
                        currentUser.name = document.getElementById('editName').value.trim();
                        currentUser.title = document.getElementById('editTitle').value.trim();
                        currentUser.location = document.getElementById('editLocation').value.trim();
                        currentUser.bio = document.getElementById('editBio').value.trim();
                        const res = await api.updateMe(currentUser);
                        if (res.error) { toast(res.error, 'error'); return; }
                        toast('Profil berhasil diperbarui!', 'success');
                        modal.classList.remove('open');
                        renderSection('profil');
                        renderTopbar();
                    });
                });

                document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
                    const inp = document.createElement('input');
                    inp.type = 'file'; inp.accept = 'image/*';
                    inp.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        toast('Mengunggah avatar...', 'info');
                        const res = await api.uploadFile(file);
                        if (res && res.url) {
                            currentUser.avatar = res.url;
                            await api.updateMe(currentUser);
                            toast('Avatar diperbarui!', 'success');
                            renderSection('profil');
                            renderTopbar();
                        }
                    };
                    inp.click();
                });

                function renderSkillPicker(query='', category='ALL'){
                    const q = query.toLowerCase().trim();
                    const skills = (category === 'ALL' ? SKILL_OPTIONS : (SKILL_CATEGORIES[category] || []))
                        .filter(s => s.toLowerCase().includes(q));
                    const picker = document.getElementById('skillPicker');
                    picker.innerHTML = skills.map(s => `<button type="button" class="skill-chip ${selectedSkills.includes(s)?'selected':''}" data-skill="${s}"><span>${s}</span>${selectedSkills.includes(s)?'<i class="fas fa-check"></i>':''}</button>`).join('')
                        || '<div class="empty-state" style="padding:20px;">Skill tidak ditemukan. Tambahkan skill sendiri di bawah.</div>';
                    picker.querySelectorAll('[data-skill]').forEach(btn => btn.addEventListener('click', ()=>{
                        const skill = btn.dataset.skill;
                        selectedSkills = selectedSkills.includes(skill) ? selectedSkills.filter(s=>s!==skill) : [...selectedSkills,skill];
                        localStorage.setItem('pv_selected_skills', JSON.stringify(selectedSkills));
                        persistUserSkills();
                        renderSkillPicker(document.getElementById('skillSearchInput').value, document.querySelector('.skill-tab.active')?.dataset.cat || 'ALL');
                        renderSelectedSkills();
                    }));
                }
                function renderSelectedSkills(){
                    const area = document.getElementById('selectedSkillChips');
                    const badge = document.getElementById('skillCountBadge');
                    if(badge) badge.textContent = `${selectedSkills.length} SELECTED`;
                    if(area) area.innerHTML = selectedSkills.map(s=>`<button type="button" class="selected-skill-chip" data-remove-skill="${s}">${s}<i class="fas fa-xmark"></i></button>`).join('') || '<span style="font-size:11px;color:var(--muted);">Belum ada skill dipilih.</span>';
                    area?.querySelectorAll('[data-remove-skill]').forEach(btn=>btn.addEventListener('click',()=>{
                        selectedSkills=selectedSkills.filter(s=>s!==btn.dataset.removeSkill);
                        localStorage.setItem('pv_selected_skills', JSON.stringify(selectedSkills));
                        persistUserSkills(); renderSkillPicker(document.getElementById('skillSearchInput').value, document.querySelector('.skill-tab.active')?.dataset.cat || 'ALL'); renderSelectedSkills();
                    }));
                }
                renderSkillPicker();
                renderSelectedSkills();
                document.getElementById('skillSearchInput')?.addEventListener('input', e=>renderSkillPicker(e.target.value, document.querySelector('.skill-tab.active')?.dataset.cat || 'ALL'));
                document.querySelectorAll('.skill-tab').forEach(tab=>tab.addEventListener('click',()=>{
                    document.querySelectorAll('.skill-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active');
                    renderSkillPicker(document.getElementById('skillSearchInput').value,tab.dataset.cat);
                }));
                document.getElementById('addSkillBtn')?.addEventListener('click',()=>{
                    const input=document.getElementById('customSkillInput'); const skill=input.value.trim();
                    if(!skill)return;
                    if(!selectedSkills.includes(skill))selectedSkills.push(skill);
                    if(!SKILL_OPTIONS.includes(skill)) SKILL_OPTIONS.push(skill);
                    localStorage.setItem('pv_selected_skills',JSON.stringify(selectedSkills)); persistUserSkills();
                    input.value=''; renderSkillPicker(document.getElementById('skillSearchInput').value,'ALL'); renderSelectedSkills();
                });

                document.getElementById('uploadGalleryBtn').addEventListener('click', () => {
                    const inp = document.createElement('input');
                    inp.type = 'file'; inp.accept = 'image/*,video/*'; inp.multiple = true;
                    inp.onchange = async (e) => {
                        const files = e.target.files;
                        if (!files.length) return;
                        toast('Mengunggah media ke galeri...', 'info');
                        for (const f of files) {
                            const res = await api.uploadFile(f);
                            if (res && res.url) {
                                currentUser.gallery.push({ id: Math.random().toString(), dataUrl: res.url });
                            }
                        }
                        await api.updateMe(currentUser);
                        toast('Galeri diperbarui!', 'success');
                        renderSection('profil');
                    };
                    inp.click();
                });
            } else if (section === 'cari') {
                const users = await api.getUsers();
                usersCache = Array.isArray(users) ? users.map(normalizeUser) : [];
                container.innerHTML = `
                    <div class="card">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span style="width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(34,211,238,.08);color:var(--cyan);"><i class="fas fa-compass"></i></span>
                            <div><h3>Eksplor Profesional</h3><div style="font-size:11px;color:var(--muted);margin-top:3px;">Cari nama, jabatan, lokasi, atau skill.</div></div>
                        </div>
                        <div class="search-wrap">
                            <i class="fas fa-search"></i>
                            <input id="userSearchInput" placeholder="Cari pengguna..." autocomplete="off" />
                        </div>
                        <div id="userSearchResults" style="margin-top:16px;"></div>
                    </div>
                `;
                const renderUsers = (query='') => {
                    const q = query.toLowerCase().trim();
                    const filtered = usersCache.filter(u => [u.name,u.title,u.location,...(u.skills||[])].filter(Boolean).join(' ').toLowerCase().includes(q));
                    const result = document.getElementById('userSearchResults');
                    result.innerHTML = filtered.map(u => {
                        const id = String(u.id || u._id || u.email || u.name);
                        return `
                        <div class="user-item">
                            <div style="width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;">
                                ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : (u.name||'P').charAt(0).toUpperCase()}
                            </div>
                            <div style="min-width:0;"><strong>${u.name}</strong><br/><span style="font-size:11px;color:var(--muted);">${u.title || 'Profesional'}${u.location ? ' · '+u.location : ''}</span>
                                ${(u.skills||[]).length ? `<div style="font-size:10px;color:var(--cyan);margin-top:5px;">${u.skills.slice(0,3).join(' · ')}</div>` : ''}
                            </div>
                            <div class="user-actions">
                                <button class="btn btn-outline btn-sm follow-btn ${isFollowing(id)?'following':''}" data-follow-id="${id}"><i class="fas ${isFollowing(id)?'fa-user-check':'fa-user-plus'}"></i> ${isFollowing(id)?'Following':'Follow'}</button>
                                <button class="btn btn-outline btn-sm" data-msg-id="${id}" style="margin-left:6px;"><i class="fas fa-envelope"></i></button>
                            </div>
                        </div>`;
                    }).join('') || '<div class="empty-state"><i class="fas fa-user-slash" style="font-size:26px;margin-bottom:10px;"></i><div>Pengguna tidak ditemukan.</div><div style="font-size:11px;margin-top:5px;">Coba kata kunci lain.</div></div>';
                    result.querySelectorAll('[data-follow-id]').forEach(btn => btn.addEventListener('click',()=>toggleFollow(btn.dataset.followId)));
                    result.querySelectorAll('[data-msg-id]').forEach(btn => btn.addEventListener('click',()=>openMessageThread(btn.dataset.msgId)));
                };
                renderUsers();
                document.getElementById('userSearchInput').addEventListener('input', e => renderUsers(e.target.value));
            } else if (section === 'pesan') {
                container.innerHTML = `<div class="card"><p style="text-align:center;color:var(--muted);padding:20px;">Memuat pesan...</p></div>`;
                await refreshMessagesCache();
                if (!usersCache.length) {
                    const users = await api.getUsers();
                    if (Array.isArray(users)) usersCache = users.map(normalizeUser);
                }
                let html = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h3 style="font-size:16px;"><i class="fas fa-inbox"></i> Kotak Masuk</h3>
                    <button class="btn btn-primary btn-sm" id="newMsgBtn"><i class="fas fa-plus"></i> Pesan Baru</button>
                </div>`;
                if (!messagesCache.length) {
                    html += `<div class="empty-state"><i class="fas fa-comment-slash" style="font-size:26px;margin-bottom:10px;"></i><div>Belum ada pesan.</div></div>`;
                } else {
                    messagesCache.forEach(t => {
                        const other = usersCache.find(u => u.id === t.userId);
                        const name = other ? other.name : 'Pengguna';
                        const avatar = other ? other.avatar : null;
                        const unread = t.lastMessage && t.lastMessage.toUserId === currentUser.id && !t.lastMessage.read;
                        html += `
                            <div class="user-item" data-thread-id="${t.userId}" style="cursor:pointer;">
                                <div style="width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;">
                                    ${avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">` : name.charAt(0).toUpperCase()}
                                </div>
                                <div style="min-width:0;flex:1;">
                                    <div><strong>${name}</strong>${unread ? ` <span style="background:var(--red);color:#fff;padding:1px 8px;border-radius:20px;font-size:10px;">Baru</span>` : ''}</div>
                                    <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.lastMessage.text}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                container.innerHTML = html;
                document.getElementById('newMsgBtn').addEventListener('click', () => {
                    let modalHtml = `<h3 style="margin-bottom:16px;">Pesan Baru</h3><div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Pilih penerima</div>`;
                    if (!usersCache.length) {
                        modalHtml += `<p style="color:var(--muted);">Belum ada pengguna lain yang bisa dihubungi.</p>`;
                    } else {
                        usersCache.forEach(u => {
                            modalHtml += `
                                <div class="user-item" data-pick-id="${u.id}" style="cursor:pointer;margin-bottom:8px;">
                                    <div style="width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;">
                                        ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : u.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div><strong>${u.name}</strong></div>
                                </div>
                            `;
                        });
                    }
                    openModal(modalHtml);
                    document.querySelectorAll('#modalContent [data-pick-id]').forEach(el => {
                        el.addEventListener('click', () => { closeModal(); openMessageThread(el.dataset.pickId); });
                    });
                });
                container.querySelectorAll('[data-thread-id]').forEach(el => {
                    el.addEventListener('click', () => openMessageThread(el.dataset.threadId));
                });
            } else if (section === 'notifikasi') {
                const notifs = [...(currentUser.notifications || [])].sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
                if (notifs.some(n => !n.read)) {
                    currentUser.notifications.forEach(n => n.read = true);
                    await api.updateMe(currentUser);
                    renderSidebar();
                    renderTopbar();
                }
                const iconMap2 = {like:'fa-heart',comment:'fa-comment',share:'fa-share-alt',follow:'fa-user-plus',post:'fa-stream',message:'fa-envelope'};
                let html = `<div class="card"><h3 style="font-size:16px;margin-bottom:16px;"><i class="fas fa-bell"></i> Notifikasi</h3>`;
                if (!notifs.length) {
                    html += `<div class="empty-state"><i class="fas fa-bell-slash" style="font-size:26px;margin-bottom:10px;"></i><div>Belum ada notifikasi.</div></div>`;
                } else {
                    notifs.forEach(n => {
                        html += `
                            <div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;">
                                <span style="width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:var(--glass);color:var(--cyan);"><i class="fas ${iconMap2[n.type] || 'fa-bell'}"></i></span>
                                <div style="flex:1;">
                                    <div style="font-size:13px;">${n.text}</div>
                                    <div style="font-size:11px;color:var(--muted);margin-top:2px;">${n.timestamp ? new Date(n.timestamp).toLocaleString() : ''}</div>
                                </div>
                                ${!n.read ? `<span style="background:var(--red);color:#fff;padding:2px 10px;border-radius:20px;font-size:10px;">Baru</span>` : ''}
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                container.innerHTML = html;
            }
        }

        async function openMessageThread(targetId) {
            targetId = String(targetId);
            let target = usersCache.find(u => u.id === targetId);
            if (!target) {
                const users = await api.getUsers();
                if (Array.isArray(users)) usersCache = users.map(normalizeUser);
                target = usersCache.find(u => u.id === targetId);
            }
            if (!target) { toast('Pengguna tidak ditemukan.', 'error'); return; }
            const thread = await api.getMessages(targetId);
            if (thread && thread.error) { toast(thread.error, 'error'); return; }
            let html = `
                <h3 style="margin-bottom:4px;">${target.name}</h3>
                <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">${target.title || 'Percakapan langsung'}</div>
                <div id="msgThread" style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0;margin-bottom:12px;">
            `;
            if (!thread || !thread.length) {
                html += `<p style="color:var(--muted);text-align:center;padding:20px;">Belum ada pesan. Mulai percakapan!</p>`;
            } else {
                thread.forEach(m => {
                    const mine = m.fromUserId === currentUser.id;
                    html += `
                        <div style="max-width:78%;padding:9px 15px;border-radius:16px;font-size:13px;align-self:${mine?'flex-end':'flex-start'};background:${mine?'var(--grad)':'var(--glass)'};color:${mine?'#fff':'var(--text)'};">
                            ${m.text}
                            <div style="font-size:10px;opacity:.75;margin-top:3px;">${m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : ''}</div>
                        </div>
                    `;
                });
            }
            html += `</div>
                <div style="display:flex;gap:10px;">
                    <input type="text" id="msgThreadInput" placeholder="Ketik pesan..." style="flex:1;padding:10px 16px;border:1px solid var(--line);border-radius:20px;background:var(--glass);color:var(--text);font-size:13px;" />
                    <button class="btn btn-primary btn-sm" id="msgThreadSend"><i class="fas fa-paper-plane"></i></button>
                </div>
            `;
            openModal(html);
            const sendIt = async () => {
                const input = document.getElementById('msgThreadInput');
                const text = input.value.trim();
                if (!text) return;
                input.disabled = true;
                const res = await api.sendMessage(targetId, text);
                input.disabled = false;
                if (res && res.error) { toast(res.error, 'error'); return; }
                openMessageThread(targetId);
            };
            document.getElementById('msgThreadSend').addEventListener('click', sendIt);
            document.getElementById('msgThreadInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') sendIt(); });
            const threadEl = document.getElementById('msgThread');
            if (threadEl) threadEl.scrollTop = threadEl.scrollHeight;
        }

        initApp();
        setTimeout(initTheme, 0);
    </script>
</body>
</html>
